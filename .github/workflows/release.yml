name: Release

# Tag push releases: publish the tagged version to npm (skipped when the
# Publish workflow already published it) and create the GitHub release.
# Authentication uses npm Trusted Publishing (OIDC) — register this
# workflow (release.yml) as a trusted publisher for the package on
# registry.npmjs.org, alongside publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify tag matches package version
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - name: Run unit tests
        run: npm test
      - name: Check whether this version is already published
        id: check
        run: |
          pkg=$(node -p "require('./package.json').version")
          if npm view sablejs@$pkg version >/dev/null 2>&1; then
            echo "sablejs@$pkg is already on the registry; skipping publish"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build artifacts
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: |
          pkg=$(node -p "require('./package.json').version")
          case "$pkg" in
            *-*) npm publish --access public --tag beta ;;
            *)   npm publish --access public ;;
          esac
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
