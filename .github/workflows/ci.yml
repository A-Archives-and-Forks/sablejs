name: Ubuntu CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Unit, Test262, and performance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check declarations (CJS and ESM consumers)
        run: npm run check:types
      - name: Fetch pinned Test262 revision
        run: npm run upstream:fetch -- test262
      - name: Run ES5.1 Test262 gate
        run: npm run test262
      - name: Run differential semantics smoke
        run: npm run test:differential
      - name: Run differential sandbox-boundary smoke
        run: npm run test:differential:boundary
      - name: Run performance smoke test
        run: npm run benchmark:smoke
      - name: Check compiled bundle-size budget
        run: npm run benchmark:size -- --check
      - name: Build publishable artifacts and verify third-party notices
        run: npm run build && npm run check:compliance

  runtimes:
    name: Node, Deno, and Bun E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: npm ci
      - name: Build portable E2E artifact
        run: npm run test:e2e:build
      - name: Run on Node
        run: npm run test:e2e:node
      - name: Run on Deno
        run: npm run test:e2e:deno
      - name: Run on Bun
        run: npm run test:e2e:bun

  examples:
    name: Runnable examples on Node, Deno, and Bun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: npm ci
      - name: Run every example and assert its output
        run: npm run check:examples

  browsers:
    name: Chromium, Firefox, and WebKit E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build portable E2E artifact
        run: npm run test:e2e:build
      - name: Run browser and Worker E2E
        run: npm run test:e2e:browsers
